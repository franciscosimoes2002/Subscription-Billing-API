name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore SubscriptionBilling.slnx
      - name: Formatting
        run: dotnet format SubscriptionBilling.slnx --verify-no-changes --no-restore
      # Warnings are errors (analyzers and NuGet vulnerability audit included), so a vulnerable dependency fails the build.
      - name: Build
        run: dotnet build SubscriptionBilling.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test --solution SubscriptionBilling.slnx --no-build --configuration Release
